<body><main class="entry-shell"><section class="entry-story"><a class="brand" href="library.html"><span class="brand-mark" aria-hidden="true"></span>审图工作台</a><div class="entry-copy"><p class="eyebrow">A LITTLE DETAIL. A BETTER DESIGN.</p><h1>让每一处反馈，<br>都落在准确的位置。</h1><p>在图片上标记问题，整理修改意见。<br>每一次认真保存，都留下清晰的来路。</p><div class="entry-mock"><img src="assets/landing.svg" alt="用于版面展示的设计样稿"><span class="point " style="left:26%;top:37%" aria-label="示意标记 1">1</span><span class="point new" style="left:22%;top:68%" aria-label="示意标记 3">3</span></div></div><p class="entry-caption">图片 · 标记 · 保存历史</p></section><section class="entry-form-area" aria-labelledby="entry-title"><div class="entry-card"><p class="eyebrow">WELCOME TO YOUR WORKSPACE</p><h2 id="entry-title">开始一次审阅</h2><p>先告诉我们，你希望使用的昵称。</p><div class="entry-field"><label for="nickname">你的昵称</label><input class="entry-input" id="nickname" value="小明" readonly aria-describedby="nickname-help"><p class="tiny" id="nickname-help">这个昵称会显示在你的保存记录中。</p></div><a class="btn primary entry-submit" href="library.html">进入工作台 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a><div class="entry-note"><strong>简单进入，共同查看。</strong><br>昵称用于标识操作人，不验证身份。<br>工作空间内的图片和审阅内容共同可见。</div></div></section></main></body>
